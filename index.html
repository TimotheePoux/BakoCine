<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BakoCiné</title>
    <link rel="icon" href="./media/icon.png">
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/mainPage.css" />
    <script src="./js/fonctions.js"></script>
    <script src="./js/mainPage.js" defer type="module"></script>
</head>
<body>
    <header>
        <a href="./index.html" id="title">
            <img src="./media/logo-bakociné.svg" alt="logo BakoCiné">
            <h1>BakoCiné</h1>
        </a>

        <nav>
            <a href="#films">Films</a>
            <a href="#tv">Séries</a>
            <a href="#tendances">Populaires</a>
            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" viewBox="0 0 72 72">
                <path d="M56 48c2.209 0 4 1.791 4 4 0 2.209-1.791 4-4 4-1.202 0-38.798 0-40 0-2.209 0-4-1.791-4-4 0-2.209 1.791-4 4-4C17.202 48 54.798 48 56 48zM56 32c2.209 0 4 1.791 4 4 0 2.209-1.791 4-4 4-1.202 0-38.798 0-40 0-2.209 0-4-1.791-4-4 0-2.209 1.791-4 4-4C17.202 32 54.798 32 56 32zM56 16c2.209 0 4 1.791 4 4 0 2.209-1.791 4-4 4-1.202 0-38.798 0-40 0-2.209 0-4-1.791-4-4 0-2.209 1.791-4 4-4C17.202 16 54.798 16 56 16z"></path>
            </svg>
            <ul>
                <li><a href="#tendances">Populaires</a></li>
                <li><a href="#tv">Séries</a></li>
                <li><a href="#films">Films</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="search">
            <div>
                <input type="text" id="search-input" name="query" placeholder="Rechercher...">
                <button id = "search-button">
                    <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="100" height="100" viewBox="0 0 50 50">
                        <path d="M 21 3 C 11.601563 3 4 10.601563 4 20 C 4 29.398438 11.601563 37 21 37 C 24.355469 37 27.460938 36.015625 30.09375 34.34375 L 42.375 46.625 L 46.625 42.375 L 34.5 30.28125 C 36.679688 27.421875 38 23.878906 38 20 C 38 10.601563 30.398438 3 21 3 Z M 21 7 C 28.199219 7 34 12.800781 34 20 C 34 27.199219 28.199219 33 21 33 C 13.800781 33 8 27.199219 8 20 C 8 12.800781 13.800781 7 21 7 Z"></path>
                    </svg>
                </button>
            </div>
        </div>
        <section id = "research_results">
            <div class = "titleList">
                <h2>Résultats</h2>
                <button>Films</button>
                <button>Séries</button>
                <button>Acteurs</button>
            </div>
            <div class = "list" id = "listResultsMovies">
            </div>
            <div class = "list" id = "listResultsTV">
            </div>
            <div class = "list" id = "listResultsPeople">
            </div>
        </section>
        <section id = "tendances">
            <div class = "titleList">
                <h2>Tendances</h2>
                <button value = "trending/all/day">Aujourd'hui</button>
                <button value = "trending/all/week">Cette semaine</button>
            </div>
            <div class = "list" id = "listTendances">
            </div>
        </section>
        <section id = "tv">
            <div class = "titleList">
                <h2>Séries TV</h2>
                <button value = "tv/top_rated">Mieux notées</button>
                <button value = "tv/popular">Populaires</button>
            </div>
            <div class = "list" id = "listTv">
            </div>
        </section>
        <section id = "films">
            <div class = "titleList">
                <h2>Films</h2>
                <button value = "movie/top_rated">Mieux notés</button>
                <button value = "movie/popular">Populaires</button>
            </div>
            <div class = "list" id = "listFilms">
            </div>
        </section>
    </main>
</body>
<footer>
    <img src="./media/tmdb.svg" alt="logo tmdb">
    <p>Timothée Poux - 2026</p>
</footer>
</html>
